[package]
name = "local-web-qa-studio-desktop"
version = "1.0.0"
description = "AirgapDroid — Self-hosted local Android QA & Developer Studio"
authors = ["AirgapDroid"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
