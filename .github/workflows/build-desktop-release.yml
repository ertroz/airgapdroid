name: Build & Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
            sidecar_targets: "aarch64-apple-darwin x86_64-apple-darwin"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            sidecar_targets: "x86_64-pc-windows-msvc"
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            sidecar_targets: "x86_64-unknown-linux-gnu"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux Tauri system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch official Google ADB sidecar(s) & compile Orchestrator sidecar(s)
        shell: bash
        run: |
          for triple in ${{ matrix.sidecar_targets }}; do
            node scripts/fetch-platform-tools.js --target "$triple"
            node scripts/build-sidecars.js --target "$triple"
          done

      - name: Build Web UI
        run: npm run build --workspace=@qa-studio/web-ui

      - name: Build Tauri Desktop Installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/desktop
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: "Local Web QA Studio ${{ github.ref_name }}"
          releaseBody: "1-Click Native Desktop Installers for macOS (Universal .dmg), Windows (.msi/.exe), and Linux (.AppImage/.deb)."
          releaseDraft: true
          prerelease: false
