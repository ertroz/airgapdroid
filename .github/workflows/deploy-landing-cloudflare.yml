name: Deploy Landing Page to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - 'packages/landing/**'
      - '.github/workflows/deploy-landing-cloudflare.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Landing Page
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Landing Page (@qa-studio/landing)
        env:
          VITE_GITHUB_REPO: ${{ vars.VITE_GITHUB_REPO }}
          VITE_RELEASE_VERSION: ${{ vars.VITE_RELEASE_VERSION }}
          VITE_GUMROAD_URL: ${{ vars.VITE_GUMROAD_URL }}
          VITE_KIRI_REPO: ${{ vars.VITE_KIRI_REPO }}
        run: npm run build:landing

      - name: Deploy to Cloudflare (Workers Static Assets)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config packages/landing/wrangler.jsonc
